name: Daily PokeClue Image

on:
  schedule:
    # 매일 KST 00:05 (UTC 15:05)
    - cron: '5 15 * * *'
  workflow_dispatch:
    inputs:
      date_override:
        description: '날짜 오버라이드 (YYYY-MM-DD). 비우면 어제 날짜 자동 사용.'
        required: false
        default: ''
      pokemon_id_override:
        description: '포켓몬 ID 오버라이드 (숫자 또는 mega/pinsir 형태). 입력 시 해당 포켓몬으로 강제 전송.'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Korean fonts
        run: sudo apt-get install -y fonts-noto-cjk && fc-cache -fv

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Generate image & send email
        working-directory: scripts
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          SEND_TO: ${{ secrets.SEND_TO }}
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
          POKEMON_ID_OVERRIDE: ${{ github.event.inputs.pokemon_id_override }}
        run: node generate-daily.js

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-image
          path: scripts/output/*.png
          retention-days: 7
